<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract AI network visualization">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f3eefb"/>
      <stop offset="1" stop-color="#e7ddf5"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dacaff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#c4a6ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b4fbf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d2fa5" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#8b4fbf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6d2fa5" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#612c8b" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#8b4fbf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#612c8b" stop-opacity="0.38"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#612c8b" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <ellipse cx="800" cy="430" rx="460" ry="320" fill="url(#core)" filter="url(#soft)"/>

  <g stroke="url(#line)" stroke-width="1.4" fill="none">
    <path d="M800 450 L300 170"/>
    <path d="M800 450 L520 120"/>
    <path d="M800 450 L800 110"/>
    <path d="M800 450 L1110 140"/>
    <path d="M800 450 L1320 260"/>
    <path d="M800 450 L1450 470"/>
    <path d="M800 450 L1310 690"/>
    <path d="M800 450 L1080 800"/>
    <path d="M800 450 L760 810"/>
    <path d="M800 450 L460 760"/>
    <path d="M800 450 L220 610"/>
    <path d="M800 450 L150 380"/>
    <path d="M300 170 L520 120 L800 110 L1110 140 L1320 260"/>
    <path d="M1450 470 L1310 690 L1080 800 L760 810 L460 760 L220 610 L150 380"/>
    <path d="M300 170 L150 380 L220 610 L460 760"/>
    <path d="M520 120 L460 760"/>
    <path d="M800 110 L760 810"/>
    <path d="M1110 140 L1080 800"/>
    <path d="M1320 260 L1310 690"/>
    <path d="M1450 470 L1310 690"/>
    <path d="M300 170 L220 610"/>
    <path d="M520 120 L150 380"/>
    <path d="M1320 260 L1450 470"/>
    <path d="M1110 140 L1080 800"/>
  </g>

  <g fill="none" stroke="url(#ring)">
    <circle cx="800" cy="450" r="150" stroke-width="1.2"/>
    <circle cx="800" cy="450" r="230" stroke-width="1" stroke-dasharray="3 12"/>
    <circle cx="800" cy="450" r="320" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="2 18"/>
    <ellipse cx="800" cy="450" rx="470" ry="150" stroke-width="0.8" stroke-opacity="0.35"/>
    <ellipse cx="800" cy="450" rx="150" ry="470" stroke-width="0.8" stroke-opacity="0.25"/>
  </g>

  <g fill="#612c8b">
    <circle cx="300" cy="170" r="3.4" opacity="0.7"/>
    <circle cx="520" cy="120" r="2.6" opacity="0.5"/>
    <circle cx="800" cy="110" r="3.8" opacity="0.75"/>
    <circle cx="1110" cy="140" r="2.8" opacity="0.55"/>
    <circle cx="1320" cy="260" r="3.2" opacity="0.65"/>
    <circle cx="1450" cy="470" r="2.6" opacity="0.5"/>
    <circle cx="1310" cy="690" r="3.4" opacity="0.7"/>
    <circle cx="1080" cy="800" r="2.8" opacity="0.55"/>
    <circle cx="760" cy="810" r="3.6" opacity="0.7"/>
    <circle cx="460" cy="760" r="2.6" opacity="0.5"/>
    <circle cx="220" cy="610" r="3.2" opacity="0.65"/>
    <circle cx="150" cy="380" r="2.8" opacity="0.55"/>
    <circle cx="800" cy="450" r="7" opacity="0.85"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="800" cy="450" r="5" fill="#4a1f6b"/>
    <circle cx="300" cy="170" r="2.4" fill="#612c8b"/>
    <circle cx="1320" cy="260" r="2.4" fill="#612c8b"/>
    <circle cx="1310" cy="690" r="2.4" fill="#612c8b"/>
    <circle cx="460" cy="760" r="2.4" fill="#612c8b"/>
    <circle cx="800" cy="110" r="2.4" fill="#612c8b"/>
  </g>

  <g fill="none" stroke="#612c8b" stroke-opacity="0.3" stroke-width="1">
    <path d="M770 450H830"/>
    <path d="M800 420V480"/>
    <path d="M760 450l-18 18"/>
    <path d="M840 450l18 18"/>
  </g>

  <rect width="1600" height="900" fill="none" stroke="#612c8b" stroke-opacity="0.06" stroke-width="2"/>
</svg>
